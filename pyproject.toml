[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fineledger"
version = "0.1.0"
description = "A countersigned fine-gold ledger with agents for jeweller-karigar job-work (Fineworks, GVAS Jeweltech)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # the core ledger and agents are pure standard library

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]
dev = ["pytest", "fastapi", "uvicorn", "httpx"]

[project.scripts]
fineledger = "fineledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
